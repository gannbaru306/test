<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>グリッチ文字（HIDDEN THINGS）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-size: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
 
    .glitch-container {
      display: flex;
      gap: 0.2rem;
    }
 
    .glitch-char {
      position: relative;
      display: inline-block;
      color: white;
      animation: glitch-anim 1s infinite;
    }
 
    .glitch-char::before,
    .glitch-char::after {
      content: attr(data-char);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      overflow: hidden;
      color: white;
      background: black;
      pointer-events: none;
    }
 
    .glitch-char::before {
      text-shadow: -2px 0 red;
      animation: glitch-before 1s infinite linear alternate-reverse;
    }
 
    .glitch-char::after {
      text-shadow: 2px 0 blue;
      animation: glitch-after 1s infinite linear alternate-reverse;
    }
 
    @keyframes glitch-before {
      0% { clip-path: inset(0 0 80% 0); }
      50% { clip-path: inset(10% 0 60% 0); }
      100% { clip-path: inset(80% 0 0 0); }
    }
 
    @keyframes glitch-after {
      0% { clip-path: inset(80% 0 0 0); }
      50% { clip-path: inset(10% 0 60% 0); }
      100% { clip-path: inset(0 0 80% 0); }
    }
 
    @keyframes glitch-anim {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(-1px, -1px); }
      60% { transform: translate(1px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>
  <div id="glitch-text" class="glitch-container"></div>
 
  <script>
    const fonts = [
      "monospace", "serif", "sans-serif",
      "Courier New", "Georgia", "Arial", "Impact", "Verdana",
      "'Noto Sans JP'", "'Noto Serif JP'", "'Yu Gothic'",
      "'游ゴシック体'", "'ＭＳ Ｐゴシック'", "'ヒラギノ角ゴ Pro W3'",
      "'メイリオ'", "'Roboto Mono'", "'Fira Code'", "'IBM Plex Mono'"
    ];
 
    const randomChars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ" +
                        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#%&@!?";
 
    const baseText = "code:HIDDENTHINGS";
    const container = document.getElementById("glitch-text");
 
    // 文字要素の初期生成
    for (let i = 0; i < baseText.length; i++) {
      const span = document.createElement("span");
      span.classList.add("glitch-char");
      span.dataset.char = baseText[i];
      span.textContent = baseText[i];
      span.dataset.original = baseText[i]; // 元の文字を記録
      container.appendChild(span);
    }
 
    const glitchChars = container.querySelectorAll(".glitch-char");
 
    function update() {
      glitchChars.forEach(char => {
        const shouldGlitch = Math.random() < 0.3; // 30%の確率でグリッチ
 
        if (shouldGlitch) {
          const randomChar = randomChars[Math.floor(Math.random() * randomChars.length)];
          const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
          char.textContent = randomChar;
          char.dataset.char = randomChar;
          char.style.fontFamily = randomFont;
        } else {
          const original = char.dataset.original;
          char.textContent = original;
          char.dataset.char = original;
          char.style.fontFamily = ""; // デフォルトフォントに戻す
        }
      });
 
      setTimeout(update, 100); // 少し遅延して繰り返す（requestAnimationFrameより制御しやすい）
    }
 
    update();
  </script>
</body>
</html>
